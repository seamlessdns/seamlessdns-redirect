<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seamless has moved</title>
    <link rel="canonical" href="https://seamlessconnect.org/">
    <meta http-equiv="refresh" content="0; url=https://seamlessconnect.org/">
    <script>
      const target = new URL(window.location.href);
      target.protocol = "https:";
      target.hostname = "seamlessconnect.org";
      target.port = "";
      window.location.replace(target.toString());
    </script>
  </head>
  <body>
    <p>Seamless has moved to <a href="https://seamlessconnect.org/">seamlessconnect.org</a>.</p>
  </body>
</html>
